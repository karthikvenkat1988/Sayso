name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libportaudio2
      - run: pip install -e ".[dev,anthropic]"
      - run: pytest --cov=sayso --cov-report=term-missing --cov-fail-under=80

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build portable, onefile, installer and zipapp
        shell: pwsh
        run: ./packaging/build.ps1 -Target portable,onefile,installer,zipapp -Python "py -3.12"
      - name: Smoke test the portable build
        shell: pwsh
        run: |
          Expand-Archive dist/Sayso-*-portable-win-x64.zip -DestinationPath smoke
          & smoke\Sayso.exe --diagnose --offline | Out-File smoke-out.txt
          if ($LASTEXITCODE -ne 0) { throw "diagnose exited with $LASTEXITCODE" }
          if (-not (Test-Path smoke\data\diagnose.json)) { throw "diagnose.json was not written" }
          Get-Content smoke\data\diagnose.json
      - uses: actions/upload-artifact@v4
        with:
          name: sayso-windows
          path: dist/*
          retention-days: 14
